[project]
name = "pids-jre-simulator"
# Packaging metadata only — NOT read at runtime. The running app gets its
# version from the exe's embedded PE metadata via app_paths.app_version();
# the release identity is the git tag. uv requires a static version field here
# (`dynamic = ["version"]` forces uv into package/build mode and breaks
# `uv run`), so this is a standalone label — no runtime coupling to keep in sync.
version = "0.5.4"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dxcam>=0.3.0",
    "keyboard>=0.13.5",
    "numpy>=2.4.2",
    "plotly>=5.24.0",
    "pygame>=2.6.1",
    "pyloudnorm>=0.2.0",
    "pywin32>=311",
    "scipy>=1.17.1",
    "soundfile>=0.13.1",
]

[dependency-groups]
build = [
    "pyinstaller>=6.19.0",
]
dev = [
    "black>=26.1.0",
    "faster-whisper>=1.2.1",
    "ffmpeg>=1.4",
    "ffmpeg-python>=0.2.0",
    "librosa>=0.11.0",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.21.1.3",
    "pre-commit>=3.7.0",
    "pyright>=1.1.408",
]

[tool.black]
  line-length = 150
