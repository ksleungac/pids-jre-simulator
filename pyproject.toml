[project]
name = "pids-jre-simulator"
# Version source of truth for DEV: app_paths.display_version() reads this field to show the
# version tag when NOT frozen (the exe instead reads its build-stamped PE metadata via
# app_version()). /build stamps the same number into version_info.txt, and /release tags it —
# keep all three in step (a future version-drift sensor guards this; see TODO). uv requires a
# static version field (`dynamic = ["version"]` forces package/build mode and breaks `uv run`).
version = "0.6.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.4.22",
    "dxcam>=0.3.0",
    "keyboard>=0.13.5",
    "numpy>=2.4.2",
    "plotly>=5.24.0",
    "pygame>=2.6.1",
    "pyloudnorm>=0.2.0",
    "pywin32>=311",
    "scipy>=1.17.1",
    "soundfile>=0.13.1",
]

[dependency-groups]
build = [
    "pyinstaller>=6.19.0",
]
dev = [
    "black>=26.1.0",
    "faster-whisper>=1.2.1",
    "ffmpeg>=1.4",
    "ffmpeg-python>=0.2.0",
    "librosa>=0.11.0",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.21.1.3",
    "pre-commit>=3.7.0",
    "pyright>=1.1.408",
]

[tool.black]
  line-length = 150
