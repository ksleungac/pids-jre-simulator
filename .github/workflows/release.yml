name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.5.0b)'
        required: true
        default: 'v0.5.0b'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build executable with PyInstaller
        run: uv run pyinstaller --onefile --console --name "JRE-PA-Simulator" main.py --clean --noconfirm

      - name: Create distribution folder structure
        run: |
          mkdir dist-release\JRE-PA-Simulator\fonts
          mkdir dist-release\JRE-PA-Simulator\data
          mkdir dist-release\JRE-PA-Simulator\audio
          copy dist\JRE-PA-Simulator.exe dist-release\JRE-PA-Simulator\
          copy fonts\* dist-release\JRE-PA-Simulator\fonts\
          copy data\translations.json dist-release\JRE-PA-Simulator\data\
          copy data\train_types.json dist-release\JRE-PA-Simulator\data\
        shell: pwsh

      - name: Create distribution zip
        run: |
          Compress-Archive -Path 'dist-release\JRE-PA-Simulator' -DestinationPath 'dist-release\JRE-PA-Simulator-${{ inputs.version }}-distribution.zip' -Force
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/JRE-PA-Simulator.exe
            dist-release/JRE-PA-Simulator-${{ inputs.version }}-distribution.zip
