# Pre-commit hooks. Run `pre-commit install` once after clone to wire up
# .git/hooks/pre-commit. See conventions.md § Tooling.
#
# Hooks:
#   - black              — formatter, version pinned to match pyproject.toml
#   - ban-production-primitives — regex-grep for conventions.md § Tooling bans
#                                 (SysFont, _MEIPASS, Path(__file__).parent, sys.frozen,
#                                  _*/ production imports)
#   - ban-derivable-literals    — AST-scan for hardcoded literals that must derive from a
#                                 canonical source (version → display_version(), bundled-
#                                 asset paths → project_root()). conventions.md § Tooling.
#   - no-ttf-fonts       — ban .ttf files in fonts/ (conventions.md § Tooling)
#   - spdx-header        — every .py carries `# SPDX-License-Identifier: MIT`
#                          (WIP_licensing.md; LICENSE grants only authored code/docs)
#   - no-tracked-ignored — a tracked file matched by .gitignore (an ignore rule added
#                          without `git rm --cached`)

repos:
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.1.0
    hooks:
      - id: black
        # line-length read from pyproject.toml [tool.black]
        # old_version.py is preserved as pre-refactor reference (conventions.md
        # § Tooling) — don't reformat. Other files including _* dev scripts
        # follow normal Black style.
        exclude: '^old_version\.py$'

  - repo: local
    hooks:
      - id: ban-production-primitives
        name: Ban forbidden production primitives (conventions.md § Tooling)
        entry: python _dev_scripts/lint_primitives.py
        language: python
        types: [python]
        # Whole-folder + whole-file exclusions: not production code, rules don't apply.
        # Anything `_`-prefixed (folder or root file) follows conventions.md § Naming
        # "_* prefix = preserved-but-not-shipped". `old_version.py` is the named
        # carve-out per conventions.md § Tooling.
        # Per-ban exemptions for files that ARE production (app_paths.py,
        # compare_fonts.py, compare_grid.py) live in lint_primitives.py BANS.
        exclude: '^(_|old_version\.py$)'

      - id: ban-derivable-literals
        name: Ban hardcoded derivable literals (conventions.md § Tooling)
        entry: python _dev_scripts/lint_primitives.py --derivable
        language: python
        types: [python]
        # Same production scope as above, BUT re-includes `*_draft.py` (the lookahead):
        # a draft is a promotion candidate, so a placeholder literal there is caught at
        # BIRTH, not only when it graduates into production — that draft→prod copy is how
        # the hardcoded 0.5.4 shipped. Other `_`-prefixed staging + old_version stay out.
        exclude: '^(?!.*_draft\.py$)(_|old_version\.py$)'

  - repo: local
    hooks:
      - id: no-ttf-fonts
        name: Ban .ttf fonts in fonts/ (conventions.md § Tooling)
        entry: python _dev_scripts/check_fonts.py
        language: python
        files: ^fonts/.*\.ttf$

      - id: spdx-header
        name: Require SPDX-License-Identifier header (WIP_licensing.md)
        entry: python _dev_scripts/check_spdx.py
        language: python
        types: [python]
        # NO exclude. The identifier is about authorship of the file, not about
        # whether it ships — `_dev_scripts/`, `_harness/` and `_tests/` are as
        # much authored code as the app, and old_version.py is retained authored
        # history. The other local hooks exclude `_` because they police
        # PRODUCTION primitives; this one has no production scope to narrow to.

  - repo: local
    hooks:
      - id: no-tracked-ignored
        name: No tracked file matched by .gitignore (WIP_licensing.md)
        entry: python _dev_scripts/check_tracked_ignored.py
        language: python
        # Repo-state check, not a file check: an ignore rule added WITHOUT
        # `git rm --cached` leaves the file tracked and shipping in every clone,
        # and the commit that added the rule reads as if it removed the file.
        always_run: true
        pass_filenames: false
